# Rust files stay under 800 lines; bigger ones may shrink but never grow
# (scripts/file-length-ratchet.py). Its own workflow so it is vendored unchanged
# into every Bilibi repository and runs without compiling.
name: File length

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: file-length-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  file-length:
    name: File length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/file-length-ratchet.py --base "origin/${{ github.base_ref }}"
