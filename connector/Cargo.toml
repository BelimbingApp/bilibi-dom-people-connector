# Connector (`people_connector/connector`), a Domain module of the People
# connector container. Discovered by the Platform when the container is
# mounted at apps/domains/people_connector; never built alone.
[package]
name = "bilibi-people-connector-connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
askama.workspace = true
bilibi-artifacts.workspace = true
bilibi-audit.workspace = true
bilibi-datetime.workspace = true
bilibi-locale.workspace = true
bilibi-ui.workspace = true
uuid.workspace = true
bilibi-authz.workspace = true
bilibi-company.workspace = true
bilibi-database.workspace = true
bilibi-menu.workspace = true
bilibi-module-registry.workspace = true
bilibi-party-ids.workspace = true
bilibi-ports.workspace = true
bilibi-settings.workspace = true
bilibi-tenancy.workspace = true
inventory.workspace = true
jiff = "0.2.38"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
thiserror.workspace = true
tokio-postgres.workspace = true

[dev-dependencies]
# Cargo makes a member of every path dependency of a member, dev-dependencies
# included, so this edge is what lets the mounted gates format, lint and build
# the walkthrough. It is never a product dependency.
# link the fixture.
bilibi-people-connector-walkthrough = { path = "../fixtures/walkthrough" }
