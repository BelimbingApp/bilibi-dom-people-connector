# The People connector walkthrough: example-only, run against a disposable
# database. Discovery never sees `fixtures/`; the connector crate lists this
# crate as a dev-dependency so the mounted gates lint and build it as a
# workspace member.
[package]
name = "bilibi-people-connector-walkthrough"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bilibi-authz.workspace = true
bilibi-base.workspace = true
bilibi-core.workspace = true
bilibi-database.workspace = true
bilibi-domains.workspace = true
bilibi-extensions.workspace = true
bilibi-module-registry.workspace = true
bilibi-people-connector-connector = { path = "../../connector" }
bilibi-tenancy.workspace = true
bilibi-walkthrough-fixture = { path = "../../../../../fixtures/walkthrough" }
bilibi-web.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true

# KC1 sync proof: an explicit deployment catalog, never a product adapter.
bilibi-ports.workspace = true
bilibi-company.workspace = true
bilibi-party-ids.workspace = true
inventory.workspace = true
jiff = "0.2.38"
serde_json.workspace = true

# KC4 browser proof: serves the real web host with a fixture-only directory port.
axum.workspace = true

# KC3 signed receipt proof. No signing secret or raw delivery is logged.
hmac.workspace = true
sha2.workspace = true
data-encoding.workspace = true
uuid.workspace = true

# KC2: drive the actual live page service against a disposable database.
bilibi-ui.workspace = true
